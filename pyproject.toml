[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oboe-py_maddinkunze"
version = "0.0.1-beta"
authors = [
  { name="Martin Kunze", email="martin@martinkunze.com" },
]
description = "A library to interface with bluetooth peripherals (headphones, currently only Bose)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/maddinkunze/oboe-py"
Issues = "https://github.com/maddinkunze/oboe-py/issues"

[tool.setuptools.package-dir]
oboe = "src"